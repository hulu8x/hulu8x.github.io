<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Quiz Slide</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .timer-ring {
            transition: stroke-dashoffset 1s linear, stroke 0.3s ease;
        }
        .option-btn {
            transition: all 0.2s ease;
        }
        .option-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .bar-animate {
            animation: expandWidth 1.5s ease-out forwards;
        }
        @keyframes expandWidth {
            from { width: 0; }
        }
        .slide-in {
            animation: slideInFromBottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes slideInFromBottom {
            0% { transform: translateY(20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center justify-center text-gray-800">

    <!-- Main Quiz Container -->
    <main id="slide-container" class="bg-white rounded-3xl shadow-xl w-full max-w-5xl min-h-[600px] h-auto flex flex-col relative overflow-hidden border border-gray-100">
        
        <!-- Header: Timer -->
        <header class="p-6 flex justify-end items-center border-b border-gray-100">
            <div class="relative w-16 h-16 flex items-center justify-center">
                <svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="45" fill="none" stroke="#e5e7eb" stroke-width="8"></circle>
                    <circle id="timer-circle" cx="50" cy="50" r="45" fill="none" stroke="#3b82f6" stroke-width="8" 
                            stroke-dasharray="283" stroke-dashoffset="0" class="timer-ring"></circle>
                </svg>
                <span id="timer-text" class="absolute text-xl font-bold text-gray-700">20</span>
            </div>
        </header>

        <!-- Content Area -->
        <div class="flex-1 flex flex-col lg:flex-row w-full h-full">
            
            <!-- Left: Question -->
            <div class="w-full lg:w-1/2 p-8 lg:p-12 flex flex-col justify-center border-b lg:border-b-0 lg:border-r border-gray-100">
                <span class="text-blue-500 font-semibold tracking-wider uppercase text-sm mb-4" id="question-label">Question</span>
                <h1 id="question-text" class="text-3xl lg:text-4xl font-extrabold text-gray-900 leading-tight mb-4">
                    Loading question...
                </h1>
                <p id="question-subtitle" class="text-gray-500 text-lg"></p>
            </div>

            <!-- Right: Options -->
            <div class="w-full lg:w-1/2 p-6 lg:p-12 flex flex-col justify-center bg-gray-50/50">
                <div id="options-container" class="grid grid-cols-1 gap-4">
                    <!-- Options will be injected here via JS -->
                </div>
            </div>
        </div>

        <!-- Result Overlay (Hidden by default, z-index 30 to cover pagination) -->
        <div id="result-overlay" class="absolute inset-0 bg-white/95 backdrop-blur-sm z-30 hidden flex-col items-center justify-start p-6 lg:p-10 overflow-y-auto">
            <div class="max-w-4xl w-full mx-auto flex flex-col items-center slide-in">
                <div id="result-icon" class="text-6xl mb-4"></div>
                <h2 id="result-title" class="text-4xl font-extrabold mb-2 text-center"></h2>
                <p id="result-message" class="text-gray-600 text-lg mb-8 text-center max-w-2xl"></p>
                
                <!-- Custom Data Area (Charts, Tables, Images) -->
                <div id="result-custom-content" class="w-full mb-8"></div>

                <button id="next-btn" onclick="nextQuestion()" class="mt-4 px-8 py-4 bg-blue-600 hover:bg-blue-700 text-white rounded-full font-bold text-lg transition-colors shadow-lg hover:shadow-xl">
                    Next Question
                </button>
            </div>
        </div>

    </main>

    <!-- Pagination Container (Moved to bottom) -->
    <div id="pagination" class="flex flex-wrap justify-center gap-2 mt-6 pb-6 w-full max-w-5xl">
        <!-- Pagination buttons will be injected here -->
    </div>

        let currentQuestion = 0;
        let timer;
        let timeLeft = 20;
        let isAnswered = false;

        const timerText = document.getElementById('timer-text');
        const timerCircle = document.getElementById('timer-circle');
        const questionText = document.getElementById('question-text');
        const questionSubtitle = document.getElementById('question-subtitle');
        const questionLabel = document.getElementById('question-label');
        const optionsContainer = document.getElementById('options-container');
        
        const resultOverlay = document.getElementById('result-overlay');
        const resultIcon = document.getElementById('result-icon');
        const resultTitle = document.getElementById('result-title');
        const resultMessage = document.getElementById('result-message');
        const resultCustomContent = document.getElementById('result-custom-content');
        const nextBtn = document.getElementById('next-btn');
        const paginationContainer = document.getElementById('pagination');

        function loadSlide(index) {
            currentQuestion = index;
            isAnswered = false;
            timeLeft = 20;
            
            // Render Pagination
            renderPagination();

            // Hide result
            resultOverlay.classList.add('hidden');
            resultOverlay.classList.remove('flex');
            
            // Reset timer UI
            timerText.innerText = timeLeft;
            timerText.classList.remove('text-red-500');
            timerCircle.style.strokeDashoffset = 0;
            timerCircle.style.stroke = "#3b82f6";

            const data = quizData[currentQuestion];
            questionLabel.innerText = `Question ${currentQuestion + 1} of ${quizData.length}`;
            questionText.innerText = data.question;
            questionSubtitle.innerText = data.subtitle;

            // Generate options
            optionsContainer.innerHTML = '';
            data.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn w-full bg-white border-2 border-gray-200 text-left p-3 md:p-4 rounded-xl text-lg font-medium text-gray-700 hover:border-blue-400 focus:outline-none flex items-center';
                
                // Use innerHTML to support Flag images correctly
                btn.innerHTML = `<span class="mr-4 text-2xl flex items-center justify-center w-8">${opt.icon}</span> ${opt.text}`;
                
                btn.onclick = () => checkAnswer(i);
                optionsContainer.appendChild(btn);
            });

            clearInterval(timer);
            startTimer();
        }

        function renderPagination() {
            paginationContainer.innerHTML = '';
            quizData.forEach((_, i) => {
                const btn = document.createElement('button');
                btn.innerText = i + 1;
                btn.className = `w-10 h-10 rounded-full font-bold text-sm flex items-center justify-center transition-colors ${
                    i === currentQuestion 
                    ? 'bg-blue-600 text-white shadow-md' 
                    : 'bg-white text-gray-500 border border-gray-300 hover:bg-gray-100'
                }`;
                btn.onclick = () => loadSlide(i);
                paginationContainer.appendChild(btn);
            });
        }

        function startTimer() {
            const circumference = 283; // 2 * pi * r (r=45)
            
            timer = setInterval(() => {
                timeLeft--;
                timerText.innerText = timeLeft;

                const offset = circumference - (timeLeft / 20) * circumference;
                timerCircle.style.strokeDashoffset = offset;

                if (timeLeft <= 5) {
                    timerCircle.style.stroke = "#ef4444"; // Red
                    timerText.classList.add('text-red-500');
                }

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    checkAnswer(-1, true); // Timeout
                }
            }, 1000);
        }

        function checkAnswer(selectedIndex, isTimeout = false) {
            if (isAnswered) return;
            isAnswered = true;
            clearInterval(timer);

            const data = quizData[currentQuestion];
            const correctIndex = data.options.findIndex(o => o.correct);
            const isCorrect = selectedIndex === correctIndex;

            // Highlight buttons
            const buttons = optionsContainer.children;
            for (let i = 0; i < buttons.length; i++) {
                buttons[i].disabled = true;
                if (i === correctIndex) {
                    buttons[i].classList.remove('border-gray-200');
                    buttons[i].classList.add('border-green-500', 'bg-green-50', 'text-green-700');
                } else if (i === selectedIndex && !isCorrect) {
                    buttons[i].classList.remove('border-gray-200');
                    buttons[i].classList.add('border-red-500', 'bg-red-50', 'text-red-700');
                } else {
                    buttons[i].classList.add('opacity-50');
                }
            }

            // Show Result Overlay after brief delay
            setTimeout(() => {
                showResult(isCorrect, isTimeout, data);
            }, 800);
        }

        function showResult(isCorrect, isTimeout, data) {
            resultOverlay.classList.remove('hidden');
            resultOverlay.classList.add('flex');

            if (isTimeout) {
                resultIcon.innerText = "⏰";
                resultTitle.innerText = "Time's Up!";
                resultTitle.className = "text-4xl font-extrabold mb-2 text-center text-orange-500";
                resultMessage.innerText = data.incorrectMsg;
            } else if (isCorrect) {
                resultIcon.innerText = "🎉";
                resultTitle.innerText = "Correct!";
                resultTitle.className = "text-4xl font-extrabold mb-2 text-center text-green-500";
                resultMessage.innerText = data.correctMsg;
            } else {
                resultIcon.innerText = "❌";
                resultTitle.innerText = "Incorrect!";
                resultTitle.className = "text-4xl font-extrabold mb-2 text-center text-red-500";
                resultMessage.innerText = data.incorrectMsg;
            }

            resultCustomContent.innerHTML = data.customContent || '';

            if (currentQuestion < quizData.length - 1) {
                nextBtn.innerText = "Next Question";
            } else {
                nextBtn.innerText = "Restart Quiz";
            }
        }
        
        function nextQuestion() {
            if (currentQuestion < quizData.length - 1) {
                loadSlide(currentQuestion + 1);
            } else {
                loadSlide(0);
            }
        }

        // Initialize first slide
        loadSlide(0);
    </script>
